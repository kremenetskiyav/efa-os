# Private Daily Brief rendering bridge. No host ports and no delivery credentials.
services:
  efa-daily-brief:
    container_name: efa-daily-brief
    build:
      context: .
      dockerfile: services/daily_brief/Dockerfile
    restart: unless-stopped
    environment:
      EFA_DB_HOST: ${EFA_DB_HOST}
      EFA_DB_PORT: ${EFA_DB_PORT}
      EFA_DB_NAME: ${EFA_DB_NAME}
      EFA_DB_USER: ${EFA_DB_USER}
      EFA_DB_PASSWORD: ${EFA_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - efa-tools

networks:
  efa-tools:
    external: true
    name: efa-tools
