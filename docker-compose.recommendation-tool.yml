# Compose fragment: include together with the existing local runtime Compose file.
# No `ports` entry: only containers on the same Compose network can reach this service.
services:
  efa-recommendation-tool:
    build:
      context: ./services/recommendation_engine
    restart: unless-stopped
    environment:
      EFA_DB_HOST: ${EFA_DB_HOST}
      EFA_DB_PORT: ${EFA_DB_PORT}
      EFA_DB_NAME: ${EFA_DB_NAME}
      EFA_DB_USER: ${EFA_DB_USER}
      EFA_DB_PASSWORD: ${EFA_DB_PASSWORD}
      EFA_RECOMMENDATION_LOW_MARGIN_PERCENT: ${EFA_RECOMMENDATION_LOW_MARGIN_PERCENT:-15}
      EFA_ANOMALY_MIN_PERIOD_UNITS: ${EFA_ANOMALY_MIN_PERIOD_UNITS:-5}
      EFA_ANOMALY_PROFIT_DROP_PERCENT: ${EFA_ANOMALY_PROFIT_DROP_PERCENT:-20}
      EFA_ANOMALY_MARGIN_DROP_PERCENTAGE_POINTS: ${EFA_ANOMALY_MARGIN_DROP_PERCENTAGE_POINTS:-5}
      EFA_ANOMALY_LOGISTICS_INCREASE_PERCENT: ${EFA_ANOMALY_LOGISTICS_INCREASE_PERCENT:-20}
      EFA_ANOMALY_COMMISSION_INCREASE_PERCENT: ${EFA_ANOMALY_COMMISSION_INCREASE_PERCENT:-20}
      EFA_PROMOTION_ENDING_SOON_DAYS: ${EFA_PROMOTION_ENDING_SOON_DAYS:-7}
    networks:
      - efa-tools

networks:
  efa-tools:
    external: true
    name: efa-tools
